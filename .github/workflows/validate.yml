name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  syntax:
    name: JS Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate JS syntax
        run: |
          echo "=== Pixeldarium Syntax Validation ==="
          FAIL=0
          for f in config.js state.js utils.js planet.js terrain.js food.js \
                   organisms.js settlements.js render-terrain-cache.js render.js \
                   persistence.js ui.js main.js; do
            if [ -f "$f" ]; then
              printf "%s: " "$f"
              if node --check "$f" 2>&1; then
                echo "OK"
              else
                echo "FAIL"
                FAIL=1
              fi
            fi
          done

          # Also check any files in js/ subdirectories
          if [ -d "js" ]; then
            echo ""
            echo "--- JS Subdirectory Syntax Check ---"
            while read -r f; do
              printf "%s: " "$f"
              if node --check "$f" 2>&1; then
                echo "OK"
              else
                echo "FAIL"
                FAIL=1
              fi
            done < <(find js -name "*.js" | sort)
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Syntax validation failed"
            exit 1
          fi
          echo "=== All syntax checks passed ==="

      - name: Validate strict mode
        run: |
          echo "=== Pixeldarium Strict Mode Validation ==="
          FAIL=0
          while read -r f; do
            FIRST_LINE="$(head -n 1 "$f")"
            if [ "$FIRST_LINE" != '"use strict";' ]; then
              echo "::error file=$f::Missing first-line strict mode directive"
              FAIL=1
            fi
          done < <(find js -name "*.js" | sort)

          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "=== All js/ files declare strict mode ==="

      - name: Run test suite
        run: |
          echo "=== Pixeldarium Test Suite ==="
          START=$(date +%s)
          npm test
          END=$(date +%s)
          echo "=== Tests completed in $((END - START))s ==="

      - name: Check whitespace
        run: |
          if ! git diff --check HEAD~1 2>/dev/null; then
            echo "::warning::Whitespace issues detected"
          fi

      - name: Check line endings
        run: |
          CRLF=$(grep -rlP '\r\n' *.js *.html *.css 2>/dev/null || true)
          if [ -n "$CRLF" ]; then
            echo "::error::CRLF line endings found in: $CRLF"
            exit 1
          fi
          echo "All files use LF line endings"
